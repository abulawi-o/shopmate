<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner control panel</title><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><p style="text-align:center;margin-top:20vh;color:#4C5852">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script>
'use strict';
const E = Engine, $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const authStore={getItem:k=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k)}catch(e){return null}},setItem:k=>0,removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch(e){}}};
authStore.setItem=(k,v)=>{try{const keep=lsGet('leo_keep')!=='0';(keep?localStorage:sessionStorage).setItem(k,v);(keep?sessionStorage:localStorage).removeItem(k)}catch(e){}};
const sb = supabase.createClient(LEO.url, LEO.key, { auth: { storage: authStore, storageKey: new URLSearchParams(location.search).get('shop') ? 'leo-admin-auth' : 'leo-owner-auth', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
const D = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const todayIso = () => E.iso(new Date());
const dow = s => (E.fromIso(s).getDay() + 6) % 7;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => addDays(d, -((d.getDay() + 6) % 7));
const niceDate = s => E.fromIso(s).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
const PLATFORMS = [['instagram', 'Instagram', 'instagram.com/yourshop'], ['facebook', 'Facebook', 'facebook.com/yourshop'], ['tiktok', 'TikTok', 'tiktok.com/@yourshop'], ['google', 'Google reviews', 'g.page/yourshop'], ['youtube', 'YouTube', 'youtube.com/@yourshop'], ['whatsapp', 'WhatsApp', 'wa.me/19055550100']];
const ICO = {
  today: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  appointments: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h3"/></svg>',
  inbox: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L3 20l1-5.2A8 8 0 1121 12z"/></svg>',
  automations: '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  customers: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.8a3.5 3.5 0 010 6.4M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/></svg>',
  team: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  website: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
  help: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 114 2c-.9.6-1.6 1.1-1.6 2.1M12 17h.01"/></svg>',
  account: '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>'
};
const TABNAMES = { today: 'Overview', appointments: 'Appointments', inbox: 'Requests', automations: 'Automations', customers: 'Customers', team: 'Team and staff', website: 'Website', help: 'Help', account: 'My login' };

const S = { user: null, shop: null, content: null, bookings: [], tickets: [], tForm: { subject: '', body: '' }, eng: null, asAdmin: false, recovery: false, tab: 'today', date: todayIso(), form: { name: '', phone: '', barber: '', date: todayIso(), time: '', end: '', consent: false }, msg: '', err: '', loginErr: '', info: '', busy: false, noAccess: '', em: '', menu: false };
S.remember = !!lsGet('leo_email'); S.keep = lsGet('leo_keep') !== '0'; if (S.remember) S.em = lsGet('leo_email') || '';
const live = k => !!S.shop && S.shop['pkg_' + k] && !S.shop['closed_' + k];
const has = k => !!S.shop && S.shop['pkg_' + k];

const defContent = c => {
  c = c && typeof c === 'object' ? c : {};
  const h = c.hours || {};
  return {
    tagline: c.tagline || '', address: c.address || '', phone: c.phone || '',
    services: Array.isArray(c.services) ? c.services : [],
    team: Array.isArray(c.team) ? c.team : [],
    hours: { start: Number.isInteger(h.start) ? h.start : 540, end: Number.isInteger(h.end) ? h.end : 1080, days: Array.isArray(h.days) && h.days.length === 7 ? h.days : [true, true, true, true, true, true, false] },
    socials: c.socials && typeof c.socials === 'object' ? c.socials : {}
  };
};

/* ---------------- data ---------------- */
async function loadAll() {
  const id = S.shop.id;
  const [c, b, e] = await Promise.all([
    sb.from('shop_site').select('content').eq('shop_id', id).maybeSingle(),
    sb.from('bookings').select('*').eq('shop_id', id).order('date').order('time'),
    sb.from('engine_state').select('data').eq('shop_id', id).maybeSingle()
  ]);
  S.content = defContent(c.data && c.data.content);
  S.bookings = b.data || [];
  S.eng = E.normalize(e.data && e.data.data);
  await loadTickets();
}
async function loadTickets() {
  if (!S.shop) return;
  const { data } = await sb.from('support_tickets').select('*').eq('shop_id', S.shop.id).order('created_at', { ascending: false }).limit(50);
  S.tickets = data || [];
}
const seenKey = () => 'leo_help_seen_' + (S.shop ? S.shop.id : '');
const unseenReplies = () => { const seen = +(lsGet(seenKey()) || 0); return S.tickets.filter(t => t.replied_at && new Date(t.replied_at).getTime() > seen).length; };
async function reloadBookings() {
  if (!S.shop || !live('ai') && !S.asAdmin) return;
  const { data } = await sb.from('bookings').select('*').eq('shop_id', S.shop.id).order('date').order('time');
  if (data) { S.bookings = data; engAuto(true); }
}
async function saveContent(msg) {
  const { error } = await sb.from('shop_site').update({ content: S.content, updated_at: new Date().toISOString() }).eq('shop_id', S.shop.id);
  S.err = error ? 'Could not save: ' + error.message : ''; S.msg = error ? '' : (msg || 'Saved.');
}
let engTimer = null;
function engSave() {
  clearTimeout(engTimer);
  engTimer = setTimeout(async () => {
    const { error } = await sb.from('engine_state').update({ data: S.eng, updated_at: new Date().toISOString() }).eq('shop_id', S.shop.id);
    if (error) { S.err = 'Could not save automations: ' + error.message; render(); }
  }, 500);
}
const shopForEngine = () => ({ name: S.shop.name, address: S.content.address, winDays: 42, hours: S.content.hours, slotMins: 30 });
/* the Engine checks by itself: on open, every minute, and whenever bookings change. Safe to repeat. */
function engAuto(rerender) {
  if (!S.shop || !S.eng || !(live('ai') || S.asAdmin && has('ai'))) return;
  const today = E.dayNum(todayIso()) + S.eng.sim;
  const [m, b] = E.runFor(S.eng, S.bookings, shopForEngine(), today);
  S.eng.lastCheck = Date.now();
  if (m || b) { S.eng.msg = `Checked by itself: ${m} new draft${m === 1 ? '' : 's'}${b ? ', ' + b + ' blocked by the rules' : ''}.`; engSave(); if (rerender) render(); }
}

/* ---------------- boot ---------------- */
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; render(); } });
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.user = null; return render(); }
  S.user = session.user;
  const { data: p } = await sb.from('profiles').select('role,shop_id').eq('id', S.user.id).maybeSingle();
  if (!p) { S.noAccess = 'This login is not connected to a shop. Ask your provider.'; return render(); }
  let shopId = p.shop_id;
  if (p.role === 'admin') {
    shopId = new URLSearchParams(location.search).get('shop');
    if (!shopId) { S.noAccess = 'admin'; return render(); }
    S.asAdmin = true;
  }
  const { data: sh } = await sb.from('shops').select('*').eq('id', shopId).maybeSingle();
  if (!sh) { S.noAccess = 'Shop not found.'; return render(); }
  S.shop = sh;
  if (S.asAdmin) await sb.from('admin_audit').insert({ shop_id: sh.id, admin_id: S.user.id, action: 'opened their space' });
  else { sb.rpc('touch_login'); sb.rpc('sync_owner_email'); }
  await loadAll();
  S.tab = firstTab();
  engAuto(false);
  render();
}
const firstTab = () => tabs()[0] || 'account';
function tabs() {
  const ai = S.asAdmin ? has('ai') : live('ai'), site = S.asAdmin ? has('site') : live('site');
  const t = [];
  if (ai) t.push('today', 'appointments', 'inbox', 'automations', 'customers');
  if (ai || site) t.push('team');
  if (site) t.push('website');
  if (!S.asAdmin) t.push('help', 'account');
  return t;
}

/* ---------------- views ---------------- */
const newCount = () => S.bookings.filter(b => b.status === 'new').length;
const draftCount = () => S.eng.outbox.filter(m => m.status === 'draft').length;
function shell(main) {
  const nav = tabs().map(k => { const n = k === 'inbox' ? newCount() : k === 'automations' ? draftCount() : k === 'help' ? unseenReplies() : 0; return `<button type="button" class="${S.tab === k ? 'on' : ''}" data-tab="${k}">${ICO[k]}<span>${TABNAMES[k]}</span>${n ? `<em>${n}</em>` : ''}</button>`; }).join('');
  const banner = S.asAdmin ? `<div class="banner"><span>ADMIN VIEW · ${esc(S.shop.name)} · your changes are real and logged</span><a class="btn small ghost" href="hq-k7m2/index.html" style="display:inline-flex;align-items:center;text-decoration:none">← Back to admin</a></div>` : '';
  const open = !!S.menu, pend = newCount() + draftCount() + (S.asAdmin ? 0 : unseenReplies());
  const bar = `<header class="bar"><button type="button" class="hbtn" data-a="menu" aria-label="Open menu" aria-expanded="${open}" aria-controls="drawer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>${pend ? '<i class="dot"></i>' : ''}</button><div class="shopn"><img src="mark.svg" alt="">${esc(S.shop.name)}</div><span class="pg">${esc(TABNAMES[S.tab] || '')}</span></header>`;
  const out = S.asAdmin ? '<a class="btn small ghost out" href="hq-k7m2/index.html" style="display:flex;align-items:center;text-decoration:none;color:var(--navon);border:1px solid var(--navfg);border-radius:12px;min-height:46px;padding:0 12px;font-weight:700">\u2190 Back to admin</a>' : '<button type="button" class="out" data-a="logout">Log out</button>';
  const drawer = `<nav class="side drawer ${open ? 'open' : ''}" id="drawer" aria-label="Main" ${open ? '' : 'aria-hidden="true"'}><div class="dtop"><div class="brand2">${esc(S.shop.name)}</div><button type="button" class="x" data-a="closemenu" aria-label="Close menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${nav}<div class="note">Every message includes your business name, address and a STOP option. Customers who say STOP are never messaged again.</div><div class="links"><a href="guide.html">How to use this panel</a> &middot; <a href="legal.html">Terms and privacy</a></div>${out}</nav>${open ? '<div class="scrim" data-a="closemenu"></div>' : ''}`;
  return `${banner}${bar}${drawer}<div class="body"><div class="main">${main}</div></div>`;
}
const toMin = v => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '')); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const toHHMM = m => m == null || m === '' ? '' : String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const rangeLabel = b => E.tLabel(b.time) + (b.end_time ? ' \u2013 ' + E.tLabel(b.end_time) : '');
const durOf = b => b.end_time ? b.end_time - b.time : ((S.content.services.find(x => x.name === b.service) || {}).mins || 30);
const overlapsWith = (date, barber, start, end) => S.bookings.filter(b => b.status === 'accepted' && b.date === date && b.barber === barber && start < b.time + durOf(b) && b.time < end);
const apptRow = b => `<div class="ap"><div><b>${rangeLabel(b)}</b> <span>${esc(b.name)}</span><small>${esc(b.service || '')}${b.barber ? ' with ' + esc(b.barber) : ''}${b.source === 'owner' ? ' · added by you' : ''}</small></div><span class="row">${b.date <= todayIso() && !(S.eng && S.eng.noshows && S.eng.noshows[b.id] != null) ? `<button type="button" class="link" data-a="noshow" data-id="${esc(b.id)}">No-show</button>` : ''}${S.eng && S.eng.noshows && S.eng.noshows[b.id] != null ? '<small>No-show noted</small>' : ''}<button type="button" class="link" data-a="cancel" data-id="${esc(b.id)}">Cancel</button></span></div>`;
const teamOn = date => S.content.team.filter(b => !b.away && b.days[dow(date)]);
function slotsFor(date) {
  const h = S.content.hours; if (!date || !h.days[dow(date)]) return [];
  const out = []; for (let t = h.start; t + 30 <= h.end; t += 30) out.push(t); return out;
}

const IC = {
  req: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L3 20l1-5.2A8 8 0 1121 12z"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>',
  bolt: '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>'
};
/* weekly counts for the overview chart: last 8 weeks, Monday to Sunday */
function weekly() {
  const m0 = monday(new Date()), weeks = [];
  for (let i = 7; i >= 0; i--) { const s = addDays(m0, -7 * i); weeks.push({ from: E.iso(s), to: E.iso(addDays(s, 6)), label: s.toLocaleDateString([], { month: 'short', day: 'numeric' }), appts: 0, reqs: 0 }); }
  S.bookings.forEach(b => { const w = weeks.find(x => b.date >= x.from && b.date <= x.to); if (!w) return; if (b.status === 'accepted') w.appts++; if (b.source === 'website' && b.status !== 'cancelled') w.reqs++; });
  return weeks;
}
function smooth(pts) { let d = 'M' + pts[0][0] + ',' + pts[0][1]; for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], cx = (x0 + x1) / 2; d += ' C' + cx + ',' + y0 + ' ' + cx + ',' + y1 + ' ' + x1 + ',' + y1; } return d; }
function chart(weeks) {
  const W = 640, H = 190, padB = 24, padT = 12, max = Math.max(4, ...weeks.map(w => Math.max(w.appts, w.reqs)));
  const xs = i => 26 + i * ((W - 52) / (weeks.length - 1)), ys = v => padT + (H - padB - padT) * (1 - v / max);
  const line = k => weeks.map((w, i) => [Math.round(xs(i)), Math.round(ys(w[k]))]);
  const area = k => { const p = line(k); return smooth(p) + ' L' + p[p.length - 1][0] + ',' + (H - padB) + ' L' + p[0][0] + ',' + (H - padB) + ' Z'; };
  const labels = weeks.map((w, i) => i % 2 === 0 ? `<text x="${Math.round(xs(i))}" y="${H - 6}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${esc(w.label)}</text>` : '').join('');
  const grid = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${Math.round(padT + (H - padB - padT) * f)}" y2="${Math.round(padT + (H - padB - padT) * f)}" stroke="currentColor" opacity=".12"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Appointments and requests over the last 8 weeks"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FE0EE" stop-opacity=".55"/><stop offset="1" stop-color="#7FE0EE" stop-opacity="0"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A99CFF" stop-opacity=".5"/><stop offset="1" stop-color="#A99CFF" stop-opacity="0"/></linearGradient></defs>${grid}<path d="${area('reqs')}" fill="url(#g2)"/><path d="${smooth(line('reqs'))}" fill="none" stroke="#A99CFF" stroke-width="2.5" stroke-linecap="round"/><path d="${area('appts')}" fill="url(#g1)"/><path d="${smooth(line('appts'))}" fill="none" stroke="#7FE0EE" stroke-width="2.5" stroke-linecap="round"/>${labels}</svg>`;
}
function viewToday() {
  const t = todayIso(), list = S.bookings.filter(b => b.status === 'accepted' && b.date === t).sort((a, b) => a.time - b.time);
  const on = teamOn(t).map(b => b.name), h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  const kc = k => S.eng.outbox.filter(m => m.kind === k && m.status !== 'blocked').length;
  const weeks = weekly(), tot = k => weeks.reduce((n, w) => n + w[k], 0), any = tot('appts') + tot('reqs') > 0;
  const custs = new Set(S.bookings.filter(b => b.status === 'accepted' && b.phone).map(b => String(b.phone).replace(/\D/g, ''))).size;
  const tile = (cls, ico, n, l, d, tab) => `<${tab ? 'button type="button" data-tab="' + tab + '"' : 'div'} class="stat ${cls}"><span class="ico">${ico}</span><b>${n}</b><span>${l}</span><span>${d}</span></${tab ? 'button' : 'div'}>`;
  const recent = S.bookings.slice().sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 5);
  const act = recent.length ? recent.map(b => `<div class="act"><span class="av">${esc((b.name || '?').charAt(0).toUpperCase())}</span><div><b>${esc(b.name)}</b><small>${b.status === 'new' ? 'Sent a request' : b.status === 'accepted' ? 'Booked' : b.status === 'cancelled' ? 'Cancelled' : 'Declined'} · ${esc(b.service || 'Appointment')} · ${niceDate(b.date)} ${E.tLabel(b.time)}</small></div><span class="tag ${b.status === 'new' ? 'warn' : b.status}">${b.status === 'new' ? 'New' : b.status === 'accepted' ? 'Booked' : b.status}</span></div>`).join('') : '<p class="fine">Nothing yet. Requests and bookings show up here as they happen.</p>';
  return `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h3>${hi}</h3><p class="fine" style="margin:0">${esc(S.shop.name)} · ${niceDate(t)}</p></div><span class="dry">PRACTICE RUN · NOTHING IS SENT</span></div>
  <div class="grid2"><div class="hero"><div><h4>Business overview</h4><div class="sub">Last 8 weeks, by week</div></div>
    <div class="legend"><div><small><i style="background:#7FE0EE"></i>Appointments</small><b>${tot('appts')}</b></div><div><small><i style="background:#A99CFF"></i>Website requests</small><b>${tot('reqs')}</b></div><div><small>Customers</small><b>${custs}</b></div></div>
    ${chart(weeks)}${any ? '' : '<p class="empty">No bookings yet. As requests and appointments come in, this chart fills in by itself.</p>'}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h4>Today's schedule</h4><span class="tag">${list.length}</span></div>${list.length ? list.map(apptRow).join('') : '<p class="fine">Nothing booked yet today.</p>'}<small>${on.length ? 'Working today: ' + esc(on.join(', ')) : 'Nobody working today'}</small></div></div>
  <div class="stats">${tile('dark', IC.req, newCount(), 'New requests', 'waiting for your answer', 'inbox')}${tile('', IC.cal, list.length, 'Appointments today', on.length ? 'Working: ' + esc(on.join(', ')) : 'Nobody working')}${tile('', IC.bolt, draftCount(), 'Messages to approve', 'drafted, nothing sent', 'automations')}${tile('', IC.star, kc('review'), 'Review requests', 'drafted so far')}</div>
  <div class="grid2"><div class="card"><h4>Recent activity</h4>${act}</div>
  <div class="card"><h4>What the system drafted</h4><div class="act"><span class="av">${kc('reminder')}</span><div><b>Appointment reminders</b><small>24 hours and 2 hours before</small></div></div><div class="act"><span class="av">${kc('missed') + kc('inquiry')}</span><div><b>Missed calls and inquiries</b><small>text-backs and follow-ups</small></div></div><div class="act"><span class="av">${kc('winback')}</span><div><b>Win-back notes</b><small>customers not seen in 6 weeks</small></div></div></div></div>`;
}
function viewInbox() {
  const nw = S.bookings.filter(b => b.status === 'new').sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)));
  const done = S.bookings.filter(b => (b.status === 'accepted' || b.status === 'declined') && b.source === 'website').sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 5);
  const card = b => {
    const opts = b.barber === 'Anyone' || !b.barber ? `<label class="l">Give it to<select data-pick="${esc(b.id)}">${teamOn(b.date).map(x => `<option>${esc(x.name)}</option>`).join('') || '<option value="">Nobody working that day</option>'}</select></label>` : '';
    return `<div class="req"><div><b>${esc(b.name)}</b> <span class="fine">${esc(b.phone)}</span></div>

  <form class="card" id="emForm"><h4>Change email</h4><div class="form2"><label class="l">New email<input type="email" id="nem" maxlength="120" required></label><label class="l">Current password<input type="password" id="epw" autocomplete="current-password" maxlength="100" required></label></div>
    <p class="fine">We email the new address to confirm the change.</p><div class="row"><button class="btn small" type="submit">Change email</button></div></form>
  <div class="card"><h4>Help</h4><p><a href="guide.html">How to use this panel</a> &middot; <a href="legal.html">Terms and privacy</a></p></div>`;
}
function loginView() {
  if (S.recovery) return `<div class="login"><div class="brandL">Choose a new password</div><form class="card" id="recForm"><label class="l">New password (at least 10 characters)<input type="password" id="rpw" autocomplete="new-password" maxlength="100" required></label><div class="err" role="alert">${esc(S.loginErr)}</div><button class="btn" type="submit">Save and sign in</button></form></div>`;
  return `<div class="login"><img class="logoL" src="logo-dark.svg" alt="Shopmate"><div class="brandL">Owner control panel</div><form class="card" id="loginForm"><h3 style="font-size:28px">Sign in</h3>
    <label class="l">Email<input type="email" id="em" autocomplete="username" maxlength="120" value="${esc(S.em)}" required></label>
    <label class="l">Password<input type="password" id="pw" autocomplete="current-password" maxlength="100" required></label>
    <div class="chks"><label class="chk"><input type="checkbox" id="rem" ${S.remember ? 'checked' : ''}><span>Remember my email</span></label><label class="chk"><input type="checkbox" id="keep" ${S.keep ? 'checked' : ''}><span>Keep me signed in</span></label></div>
  <div class="err" role="alert">${esc(S.loginErr)}</div><div class="status">${esc(S.info)}</div>
    <button class="btn" type="submit" ${S.busy ? 'disabled' : ''}>Sign in</button><button class="link" type="button" data-a="forgot">Forgot password?</button>
    <p class="fine">Your provider created your login. There is no sign-up here.</p><p class="fine"><a href="guide.html">Help guide</a> &middot; <a href="legal.html">Terms and privacy</a></p></form></div>`;
}
function suspended() {
  return `<div class="top"><b>Owner control panel</b><button class="btn ghost small" type="button" data-a="logout">Log out</button></div><div class="login"><div class="card"><h3 style="font-size:28px">This service is paused</h3><p>Your access is currently switched off. Please contact your provider to get it going again.</p></div></div>`;
}

function render() {
  const keep = document.activeElement && document.activeElement.id;
  if (S.recovery || !S.user) { app.innerHTML = loginView(); return; }
  if (S.noAccess === 'admin') { app.innerHTML = `<div class="login"><div class="card"><h3 style="font-size:28px">You are signed in as admin</h3><p>This page is for shop owners. To look inside a client's space, open it from the admin page.</p><a class="btn" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center" href="hq-k7m2/index.html">Go to the admin page</a><button class="btn ghost" data-a="logout">Log out</button></div></div>`; return; }
  if (S.noAccess) { app.innerHTML = `<div class="login"><div class="card"><p>${esc(S.noAccess)}</p><button class="btn ghost" data-a="logout">Log out</button></div></div>`; return; }
  if (!S.asAdmin && !live('ai') && !live('site')) { app.innerHTML = suspended(); return; }
  const v = { today: viewToday, appointments: viewAppointments, inbox: viewInbox, automations: viewAutomations, customers: viewCustomers, team: viewTeam, website: viewWebsite, help: viewHelp, account: viewAccount };
  if (!tabs().includes(S.tab)) S.tab = firstTab();
  app.innerHTML = shell(v[S.tab]());
  if (keep) { const el = document.getElementById(keep); if (el) el.focus(); }
}

/* ---------------- actions ---------------- */
const err = m => { S.err = m; S.msg = ''; };
async function updateBooking(id, patch) {
  const { error } = await sb.from('bookings').update(patch).eq('id', id).eq('shop_id', S.shop.id);
  if (error) return err('Could not update: ' + error.message);
  const b = S.bookings.find(x => x.id === id); if (b) Object.assign(b, patch);
  S.err = ''; engAuto(false);
}
const ACT = {
  menu: () => { S.menu = !S.menu; },
  closemenu: () => { S.menu = false; },
  logout: async () => { await sb.auth.signOut(); location.reload(); },
  forgot: async () => {
    const em = ($('#em') || {}).value || ''; S.em = em; S.loginErr = ''; S.info = '';
    if (!/^\S+@\S+\.\S+$/.test(em)) { S.loginErr = 'Type your email above first, then press "Forgot password?".'; return; }
    await sb.auth.resetPasswordForEmail(em.trim(), { redirectTo: location.origin + location.pathname });
    S.info = 'If that email has a login, a message to reset the password is on its way.';
  },
  date: (_, el) => { S.date = el.dataset.d; },
  week: (_, el) => { S.date = E.iso(addDays(E.fromIso(S.date), 7 * +el.dataset.n)); },
  accept: async (_, el) => {
    const id = el.dataset.id, b = S.bookings.find(x => x.id === id), patch = { status: 'accepted' };
    const pick = document.querySelector(`[data-pick="${CSS.escape(id)}"]`);
    if (pick) { if (!pick.value) return err('Nobody is working that day. Decline it or change the team days.'); patch.barber = pick.value; }
    await updateBooking(id, patch);
  },
  decline: async (_, el) => { await updateBooking(el.dataset.id, { status: 'declined' }); },
  cancel: async (_, el) => {
    const id = el.dataset.id, b = S.bookings.find(x => x.id === id);
    await updateBooking(id, { status: 'cancelled' });
    if (b && S.eng && live('ai')) { const today = E.dayNum(todayIso()) + S.eng.sim, m = E.offerSlot(S.eng, shopForEngine(), today, { date: b.date, time: b.time }); if (m) { S.eng.msg = 'Slot opened. An offer to ' + m.to + ' is waiting for your OK in Automations.'; engSave(); } }
  },
  noshow: async (_, el) => { const today = E.dayNum(todayIso()) + S.eng.sim; if (E.markNoShow(S.eng, S.bookings, el.dataset.id, today)) { engAuto(false); S.eng.msg = 'Marked as a no-show. A rebook text is waiting for your OK in Automations.'; engSave(); } },
  addwl: () => { const n = ($('#wn').value || '').trim(), today = E.dayNum(todayIso()) + S.eng.sim; if (!n) return err('Type the customer name.'); E.addWaitlist(S.eng, today, n, $('#wp').value, $('#ws').value); S.eng.msg = n + ' is on the waitlist.'; engSave(); },
  simreply: () => {
    const today = E.dayNum(todayIso()) + S.eng.sim, id = $('#rc').value, text = $('#rt').value.trim(); if (!id || !text) return err('Pick a customer and type their reply.');
    const r = E.handleReply(S.eng, S.bookings, shopForEngine(), today, id, text, S.eng.sim ? 0 : new Date().getHours() * 60 + new Date().getMinutes());
    const say = { happy: 'Happy rating. A review request is waiting for your OK.', unhappy: 'Unhappy rating. It came to you first and no review link was drafted.', options: 'Open times found. A reply is waiting for your OK.', pick: 'They picked a free time. A confirmation is waiting for your OK. Add the appointment in Appointments.', 'no-slots': 'Nothing is open then. A reply asking for another time is waiting for your OK.', 'waitlist-yes': 'They said YES to the open slot. Add the appointment in Appointments.', stop: 'STOP noted. No more messages to them.', other: 'Nothing for the system to do with that reply.', unknown: 'Customer not found.' };
    S.eng.msg = say[r.type] || ''; engSave();
  },
  addAppt: async () => {
    document.querySelectorAll('[data-f]').forEach(i => { S.form[i.dataset.f] = formVal(i); });
    const f = S.form, svc = S.content.services[+f.service] || null, digits = String(f.phone).replace(/\D/g, '');
    if (!f.name.trim()) return err('Enter the customer name.');
    if (digits.length < 7) return err('Enter a valid mobile number.');
    if (!f.barber) return err('Pick a barber who is working that day.');
    const st = f.time === '' || f.time == null ? null : +f.time, en = f.end ? +f.end : null;
    if (st == null || isNaN(st)) return err('Type a start time.');
    if (en != null && en <= st) return err('The end time must be after the start time.');
    const rec = { shop_id: S.shop.id, name: f.name.trim().slice(0, 60), phone: String(f.phone).trim().slice(0, 20), service: svc ? svc.name : '', price: svc ? Number(svc.price) || 0 : 0, barber: f.barber, date: f.date, time: st, end_time: en, status: 'accepted', source: 'owner', consent: !!f.consent };
    const { data, error } = await sb.from('bookings').insert(rec).select().single();
    if (error) return err('Could not add: ' + error.message);
    S.bookings.push(data); S.form = { name: '', phone: '', barber: f.barber, date: f.date, time: '', end: '', consent: false, service: f.service };
    S.err = ''; S.msg = 'Added. The Engine picked it up.'; engAuto(false);
  },
  away: async (_, el) => { const b = S.content.team[+el.dataset.i]; b.away = !b.away; await saveContent('Saved.'); },
  day: async (_, el) => { const b = S.content.team[+el.dataset.i], k = +el.dataset.k; b.days[k] = !b.days[k]; await saveContent('Saved.'); },
  removeBarber: async (_, el) => { S.content.team.splice(+el.dataset.i, 1); await saveContent('Saved.'); },
  addBarber: async () => {
    const n = ($('#newBarber').value || '').trim().slice(0, 40); if (!n) return err('Type a first name.');
    S.content.team.push({ id: 'b' + Date.now().toString(36), name: n, role: 'Barber', days: [true, true, true, true, true, true, false], away: false }); await saveContent('Saved.');
  },
  saveAbout: async () => { document.querySelectorAll('[data-c]').forEach(i => { S.content[i.dataset.c] = i.value.trim(); }); await saveContent('Saved. Your website is updated.'); },
  open: async (_, el) => { const k = +el.dataset.k; S.content.hours.days[k] = !S.content.hours.days[k]; await saveContent('Saved.'); },
  addsvc: async () => {
    const n = ($('#svN').value || '').trim().slice(0, 60), m = Math.max(15, Math.min(300, +$('#svM').value || 30)), p = Math.max(0, Math.min(9999, +$('#svP').value || 0));
    if (!n) return err('Type the service name.'); S.content.services.push({ name: n, mins: m, price: p }); await saveContent('Saved.');
  },
  rmsvc: async (_, el) => { S.content.services.splice(+el.dataset.i, 1); await saveContent('Saved.'); },
  soc: (_, el) => { document.querySelectorAll('[data-soc]').forEach(i => { const q = i.dataset.soc, z = S.content.socials[q] || (S.content.socials[q] = { on: false, url: '' }); z.url = i.value.trim().slice(0, 200); }); const k = el.dataset.k, s = S.content.socials[k] || (S.content.socials[k] = { on: false, url: '' }); s.on = !s.on; },
  saveSoc: async () => {
    document.querySelectorAll('[data-soc]').forEach(i => { const k = i.dataset.soc, s = S.content.socials[k] || (S.content.socials[k] = { on: false, url: '' }); s.url = i.value.trim().slice(0, 200); });
    await saveContent('Saved. Your website is updated.');
  },
  ton: (_, el) => { S.eng.on[el.dataset.k] = !S.eng.on[el.dataset.k]; engAuto(false); engSave(); },
  auto: () => { S.eng.auto = !S.eng.auto; if (S.eng.auto) { engAuto(false); } engSave(); },
  previewDay: () => { S.eng.sim++; const today = E.dayNum(todayIso()) + S.eng.sim; const [m, b] = E.runFor(S.eng, S.bookings, shopForEngine(), today); S.eng.msg = `Preview of ${niceDate(E.dayIso(today))}: ${m} drafted, ${b} blocked by the rules.`; engSave(); },
  resetEng: () => { S.eng.sim = 0; S.eng.outbox = []; S.eng.stops = {}; S.eng.msg = 'Practice data reset to today.'; engSave(); },
  approve: () => { const n = E.decide(S.eng, 'released'); S.eng.msg = `${n} drafts approved (practice run, nothing was sent).`; engSave(); },
  declineAll: () => { const n = E.decide(S.eng, 'declined'); S.eng.msg = `${n} drafts declined.`; engSave(); },
  stop: (_, el) => { const c = E.stop(S.eng, S.bookings, el.dataset.id); if (c) { S.eng.msg = c.name + ' replied STOP. No more messages to them.'; engSave(); } },
  addlead: () => { const today = E.dayNum(todayIso()) + S.eng.sim, c = E.addLead(S.eng, today, $('#ln').value.trim(), $('#lp').value, $('#lt').value); engAuto(false); S.eng.msg = c.name + ' logged. The Engine picked it up by itself.'; engSave(); },
  addtest: () => { const today = E.dayNum(todayIso()) + S.eng.sim; E.addTest(S.eng, today, $('#tn').value.trim(), $('#tc').value, $('#te').value); engAuto(false); engSave(); }
};

document.addEventListener('click', async ev => {
  const tb = ev.target.closest('[data-tab]');
  if (tb) { S.tab = tb.dataset.tab; S.err = ''; S.msg = ''; S.menu = false; if (S.tab === 'help' && !S.asAdmin) { loadTickets().then(() => { lsSet(seenKey(), String(Date.now())); render(); }); } render(); window.scrollTo(0, 0); return; }
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const fn = ACT[el.dataset.a]; if (!fn) return;
  el.disabled = true;
  try { await fn(ev, el); } catch (e) { S.err = String(e.message || e); }
  render();
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.menu) { S.menu = false; render(); } });
const formVal = i => i.type === 'checkbox' ? i.checked : (i.type === 'time' ? toMin(i.value) : i.value);
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset && t.dataset.f) {
    S.form[t.dataset.f] = formVal(t);
  }
  if (t.dataset && t.dataset.h) { S.content.hours[t.dataset.h] = +t.value; saveContent('Saved.').then(render); }
});
document.addEventListener('change', ev => { const t = ev.target, k = t.dataset && t.dataset.f; if (!k) return; S.form[k] = formVal(t); if (k === 'date') S.form.barber = ''; if (['date', 'barber', 'time', 'end', 'service'].includes(k)) render(); });
document.addEventListener('submit', async ev => {
  ev.preventDefault(); const id = ev.target.id;
  if (id === 'loginForm') {
    S.busy = true; S.loginErr = ''; S.info = ''; S.em = $('#em').value.trim();
    { const rm = $('#rem').checked, kp = $('#keep').checked; lsSet('leo_keep', kp ? '1' : '0'); if (rm) lsSet('leo_email', S.em); else lsSet('leo_email', null); S.remember = rm; S.keep = kp; }
    const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
    S.busy = false;
    if (error) { S.loginErr = 'That email and password did not match.'; return render(); }
    await boot();
  } else if (id === 'recForm') {
    const pw = $('#rpw').value; if (pw.length < 10) { S.loginErr = 'Use at least 10 characters.'; return render(); }
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) { S.loginErr = error.message; return render(); }
    S.recovery = false; await boot();
  } else if (id === 'ticketForm') {
    S.err = ''; S.msg = '';
    const subject = $('#tSub').value.trim(), body = $('#tBody').value.trim();
    S.tForm = { subject, body };
    if (!subject || !body) { S.err = 'Please fill in both boxes.'; return render(); }
    const { error } = await sb.from('support_tickets').insert({ shop_id: S.shop.id, subject: subject.slice(0, 100), body: body.slice(0, 1500) });
    if (error) { S.err = /row-level security|policy/i.test(error.message) ? 'You already have 5 questions waiting. We will answer those first.' : 'Could not send: ' + error.message; return render(); }
    S.tForm = { subject: '', body: '' }; S.msg = 'Sent. We will answer here as soon as we can.'; await loadTickets(); render();
  } else if (id === 'pwForm') {
    S.err = ''; S.msg = '';
    const cur = $('#cpw').value, npw = $('#npw').value;
    if (npw.length < 10) { S.err = 'Use at least 10 characters.'; return render(); }
    const { error: e1 } = await sb.auth.signInWithPassword({ email: S.user.email, password: cur });
    if (e1) { S.err = 'Your current password is not right.'; return render(); }
    const { error } = await sb.auth.updateUser({ password: npw });
    if (error) S.err = error.message; else S.msg = 'Password changed.';
    render();
  } else if (id === 'emForm') {
    S.err = ''; S.msg = '';
    const em = $('#nem').value.trim().toLowerCase(), cur = $('#epw').value;
    const { error: e1 } = await sb.auth.signInWithPassword({ email: S.user.email, password: cur });
    if (e1) { S.err = 'Your current password is not right.'; return render(); }
    const { error } = await sb.auth.updateUser({ email: em });
    if (error) S.err = error.message; else S.msg = 'Check the new email for a confirmation message.';
    render();
  }
});
setInterval(() => { if (S.shop && document.visibilityState === 'visible') Promise.all([reloadBookings(), loadTickets()]).then(() => { if (!document.activeElement || !/INPUT|SELECT/.test(document.activeElement.tagName)) render(); }); }, 45000);
boot().catch(e => { app.innerHTML = '<div class="login"><div class="card"><p>Something went wrong loading the panel: ' + esc(e.message || e) + '</p></div></div>'; });
</script>
